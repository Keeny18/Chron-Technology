<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoonie</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/images/icon_logo.png">
</head>
<body class="index_page">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash-message flash-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    <header>
        <nav>
            <a href="/"><img src="/static/images/spoonielogo.png" alt="Spoonie" class="websitelogo" height="80"></a>
            <!-- <img src="/static/images/header_image.png" alt="Header image" class="header-image"> -->
        </nav>

        <!-- _______________________ nav bar _______________________ -->
        <div class="topnav">
            <div class="nav-left">
                <a class="notactive_page" href="/">Home</a>
            </div>
        </div>
        <!-- _______________________ end nav bar _______________________ -->
    </header>

    <main>
        <section style="text-align: center">
            <h2 class="topPageHeadings">SignUp</h2>
        </section>


        <div class="signin_signup_box">
            <div class="signin_signup_content">
                <form action="/signup" method="post">
                <label for="first_name">First Name:</label>
                <input name="first_name" id="first_name" placeholder="First Name" type="text" required>

                <label for="last_name">Last Name:</label>
                <input name="last_name" id="last_name" placeholder="Last Name" type="text" required>

                <label for="email">Email:</label>
                <input name="email" id="email" placeholder="Email" type="email" required>

                <label for="password">Password:</label>
                <input name="password" id="password" placeholder="Min 8 chars, upper, lower, number, special (!@#$%...)" type="password" required>

                <button class="signin_submit" type="submit">SignUp</button>
            </form>

            <ul class="signinlink">
                <a href="/signin" id="signup_submit">SIGN IN</a>
            </ul>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Spoonie. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        setTimeout(function() {
            document.querySelectorAll('.flash-message').forEach(function(el) {
                el.style.transition = 'opacity 0.5s ease';
                el.style.opacity = '0';
                setTimeout(function() { el.remove(); }, 500);
            });
        }, 4000);
    </script>
</body>
</html>
